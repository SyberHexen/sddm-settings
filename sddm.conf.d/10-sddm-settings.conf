# SDDM's login screen on Wayland under KWin (SDDM Settings writes this file)
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,XCURSOR_THEME=Adwaita,XCURSOR_SIZE=22
Numlock=on

[Theme]
# The theme (a directory in /usr/share/sddm/themes), e.g. slick from
# sddm-theme-slickgreeter; or choose it in SDDM Settings
#Current=slick
CursorTheme=Adwaita
CursorSize=22

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

# Log in at boot, the login screen after logging out: uncomment and set
# the user (or use SDDM Settings, Users page)
#[Autologin]
#User=
#Session=cinnamon-wayland.desktop
#Relogin=false
